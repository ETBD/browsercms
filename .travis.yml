language: ruby

sudo: false

branches:
  only:
  - master
  - develop

addons:
  postgresql: '9.6' # Match ricksteves-prod

cache:
  bundler: true

bundler_args: --without development

before_script:
  - apt-get update
  - apt-get install imagemagick
  - psql -c 'create database browsercms_test;' -U postgres
  - gem install bundler:1.17.3

install:
  - bundle install

script: bundle exec rake
