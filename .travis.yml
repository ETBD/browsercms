language: ruby
dist: xenial
os: linux

branches:
  only:
  - master
  - develop

addons:
  postgresql: '13'
  apt:
      packages:
        - postgresql-13

cache:
  bundler: true

bundler_args: --without development

before_install:
  - postgres --version

install:
  - sudo apt-get update
  - sudo apt-get install imagemagick
  - psql -c 'create database browsercms_test;' -U postgres
  - gem install bundler:1.17.3
  - bundle install

script: bundle exec rake
